# 対応計画: https://github.com/TappoyGK/suz/issues/48 の「実装の段階」。
[[exceptions]]
rule = "impl.file-length"
path = "compiler/src/ast.rs"
reason = "#48 の段階2（機械で確かめる検査）で既存の行数超過を一時的に許容する。段階6（ファイルの長さ）で概念ごとに分割し、この例外を削除する。"
max_code_lines = 585

