name: CI

on:
  pull_request:
    branches: [main, 'release/**', 'issue/**']
  push:
    branches: [main, 'release/**', 'issue/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  CC: clang
  SUZ_JOBS: '3'
  RUST_TEST_THREADS: '3'

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify change classification
        run: python3 scripts/test-ci-changes.py

      - name: Classify changed files
        id: filter
        run: python3 scripts/ci-changes.py

  work:
    name: work checks
    needs: changes
    if: >-
      always() && !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.required != 'false') && (
      (github.event_name == 'pull_request' && (
      startsWith(github.event.pull_request.stack.base.ref || github.base_ref, 'release/') ||
      startsWith(github.event.pull_request.stack.base.ref || github.base_ref, 'issue/'))) ||
      (github.event_name == 'push' && (
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/issue/')))
      )
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust and report toolchain
        run: |
          rustup show
          rustc --version
          cargo --version
          sw_vers
          uname -m
          xcodebuild -version
          clang --version
          xcrun --show-sdk-version

      - name: Check formatting and lint
        if: github.event_name == 'pull_request'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run ordinary tests
        run: |
          unset SUZ_CASES
          cargo test --locked

  release:
    name: release checks
    needs: changes
    if: >-
      always() && !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.required != 'false') && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (github.event.pull_request.stack.base.ref || github.base_ref) == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust and report toolchain
        run: |
          rustup show
          rustc --version
          cargo --version
          sw_vers
          uname -m
          xcodebuild -version
          clang --version
          xcrun --show-sdk-version

      - name: Run release checks
        run: ./scripts/test-release.sh --locked

      - name: Build and verify distribution
        run: |
          cargo build --release --locked -p suz
          python3 scripts/test-distribution.py target/release/suz

      - name: Package verified main binary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p dist
          cp target/release/suz dist/suz
          (cd dist && shasum -a 256 suz > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > dist/COMMIT
          tar -C dist -czf suz-macos-arm64.tar.gz suz SHA256SUMS COMMIT

      - name: Save verified main binary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suz-macos-arm64-${{ github.sha }}
          path: suz-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
